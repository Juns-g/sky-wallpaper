name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Run unit tests
        run: swift test
      - name: Build Sky.app bundle
        run: bash scripts/build-app.sh
      - name: Verify app bundle
        run: |
          test -x dist/Sky.app/Contents/MacOS/SkyWallpaper
          test -f dist/Sky.app/Contents/Info.plist
          test -f dist/Sky.app/Contents/Resources/AppIcon.icns
