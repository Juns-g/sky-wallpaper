name: Release DMG

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" == v* ]]; then
            echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "version=1.1.0" >> "$GITHUB_OUTPUT"
            echo "tag=v1.1.0" >> "$GITHUB_OUTPUT"
          fi
      - name: Run tests
        run: swift test
      - name: Build Sky.app and DMG
        run: |
          bash scripts/build-app.sh
          bash scripts/build-dmg.sh "${{ steps.ver.outputs.version }}"
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          files: dist/Sky-${{ steps.ver.outputs.version }}.dmg
